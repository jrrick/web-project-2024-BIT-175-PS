<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    h2{
      text-align: center;
      font-family: castillar;
      font-size: 2rem;
      font-weight: 10px;
    }
    div{
      padding: 0;
      margin: 10vh;
    }
    body{
      padding: 0;
      font-family: 'Poppins', sans-serif;
      height: 100%;
      display: flex;
      background-image:url('fourth gear advanced.jpg') no-repeat;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register to one piece</h2>
    <form action="dashboard.html" method="GET"> <!-- Change 'dashboard.html' to your target page -->
      <li>
      <input type="text" name="fullname" placeholder="Full Name" required></li>
      <li>
      <input type="email" name="email" placeholder="Email" required></li>
      <li>
      <input type="password" name="password" placeholder="Password" required>
    </li>
      <button type="submit">Sign Up</button>
    </form>
  </div>
</body>
</html>
