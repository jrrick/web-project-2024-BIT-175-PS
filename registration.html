<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <style>
    
    *{ box-sizing: border-box;
      body{
       margin: 20vh;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      height: 100%;
      display: flex;
      justify-content: center;
      background: url('fourth gear advanced.jpg')no-repeat center;
      background-size: 100%;
    }
    .form-container {
      position: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 100px 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      backdrop-filter: blur(0px);
      color: #fff;
      width: 50%;
      height: 75%;
      transition: all 0.3s ease;
    }
    .form-container input{

        width: 100%;
      padding: 12px 10px;
      border: none;
      border-radius: 10px;
      background:blueviolet;
      color: black;
      outline: none;
      transition: 0.3s ease;
      justify-content: center;
      font-size: 1.5rem;
    }
    .form-container label {
      position: absolute;
      width: 70%;
      top: 50%;
      left: 40px;
      transform: translateY(-50%);
      color: red;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .form-container h2 {
      position: 0px , 10vh;
      text-align: center;
      margin-bottom: 80px;
    }
    .form-container:hover{
      background: url('aura.jpg')no-repeat center center/cover; 
    h2{
      color: black;
      text-align: center;
      font-family: castillar;
      font-size: 2rem;
      font-weight: 10px;
    }
    div{
      padding: 0;
      margin: 10vh;
    }
    button{
      background-color: green;
      cursor: pointer;
      color: blue;
      text-underline-offset: unset;
    }
    button:hover{
      curser:pointer;
      background-color: transparent;

    }
    .sign-btn{
      text-align: center;
       padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00c6ff;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
      margin-left: 70px;
    }
    .sign-btn:hover{
      background-color: green;
    }
  }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register to one piece</h2>
    <form id="signupForm">
  <input type="text" id="first_name" placeholder="first_name" required><br><br>
  <input type="text" id="second_name" placeholder="second_name" required><br><br>
  <input type="text" id="Email" placeholder="Email"required><br><br>
  <input type="text" id="Username" placeholder="Username" required><br><br>
  <input type="password" id="password" placeholder="Password" required><br><br>
  <input type="password" id="Confirm_password" placeholder="Confirm_password" required><br><br>
  <button type="submit" class="sign-btn" >Sign Up</button>
</form>
</div>

<script>
document.getElementById("signupForm").addEventListener("submit", function(e) {
    e.preventDefault();
   window.location.href = "Index.html"; // Change this link
});
</script></body></html>
